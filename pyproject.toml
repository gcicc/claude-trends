[project]
name = "claude-trends"
version = "0.1.0"
description = "Claude Trends - sweep output as a web page, plus a local-only usage review"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
